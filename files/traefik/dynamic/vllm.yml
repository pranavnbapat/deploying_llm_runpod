http:
  routers:
    # OpenAI-compatible inference API — with GPU concurrency cap + rate limit.
    vllm-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/v1`)"
      service: vllm-svc
      priority: 50
      middlewares:
        - vllm-ratelimit
        - vllm-inflight

    # Everything else vLLM exposes (/docs, /redoc, /openapi.json, /health,
    # /metrics, /ping, /tokenize, /detokenize, /version, …).
    # Low priority so /v1 and /admin always win for their own paths.
    # Behind Basic Auth so /docs and /metrics aren't world-readable. The
    # admin-basicauth middleware is defined in control_plane.yml — Traefik's
    # file provider shares one namespace across all dynamic config files.
    vllm-aux-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      service: vllm-svc
      priority: 1
      middlewares:
        - admin-basicauth

  services:
    vllm-svc:
      loadBalancer:
        servers:
          # Keep in sync with VLLM_PORT in /workspace/envs/vllm.env.
          # 18001 chosen because Runpod's nginx owns 8001 on most templates.
          - url: "http://127.0.0.1:18001"

  middlewares:
    # NOTE: setup.sh re-derives `amount`, `average` and `burst` below from
    # MAX_NUM_SEQS on every run, so the GPU's batch size and the proxy caps can't
    # drift apart. The literals here are just the standalone defaults.
    #
    # Token-bucket rate limit. average = sustained req/s, burst = short spike allowance.
    # Sized for an Arena session (~20-30 testers). NOTE: the source is the
    # farm_assistant instance, so this bucket is effectively global, not per-user
    # (per-user throttling already happens in the frontend). Raised from 2/5 so a
    # simultaneous burst of testers isn't turned into 429s.
    vllm-ratelimit:
      rateLimit:
        average: 30
        burst: 60

    # Proxy concurrency cap. IMPORTANT: Traefik's inFlightReq REJECTS with 429
    # above `amount` — it does NOT queue. So this must sit ABOVE the expected
    # concurrent-user peak, letting requests reach vLLM, which DOES queue
    # gracefully (vLLM batches up to --max-num-seqs and queues the rest, no error).
    # Keep amount > peak concurrency, and let vLLM's --max-num-seqs be the real
    # GPU-capacity limiter. (Was 1, which serialised everything and 429'd the rest.)
    vllm-inflight:
      inFlightReq:
        amount: 32
