http:
  routers:
    # OpenAI-compatible inference API — with GPU concurrency cap + rate limit.
    vllm-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/v1`)"
      service: vllm-svc
      priority: 50
      middlewares:
        - vllm-ratelimit
        - vllm-inflight

    # Everything else vLLM exposes (/docs, /redoc, /openapi.json, /health,
    # /metrics, /ping, /tokenize, /detokenize, /version, …) — no middlewares.
    # Low priority so /v1 and /admin always win for their own paths.
    vllm-aux-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      service: vllm-svc
      priority: 1

  services:
    vllm-svc:
      loadBalancer:
        servers:
          # Keep in sync with VLLM_PORT in /workspace/envs/vllm.env.
          # 18001 chosen because Runpod's nginx owns 8001 on most templates.
          - url: "http://127.0.0.1:18001"

  middlewares:
    # Token-bucket rate limit. average = sustained req/s, burst = short spike allowance.
    vllm-ratelimit:
      rateLimit:
        average: 2
        burst: 5

    # GPU concurrency cap. amount: 1 = one in-flight request at a time per backend.
    # Critical for single-GPU vLLM — pile-ups hurt latency badly and can OOM.
    vllm-inflight:
      inFlightReq:
        amount: 1
