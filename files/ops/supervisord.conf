[supervisord]
user=root
nodaemon=false
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/ops/supervisord.pid

[supervisorctl]
serverurl=unix:///workspace/ops/supervisor.sock

[unix_http_server]
file=/workspace/ops/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


; =========================================================
; vLLM (loopback) — model + flags defined in /workspace/envs/vllm.env
; =========================================================
[program:vllm]
directory=/workspace
command=/workspace/bin/run_vllm.sh
autostart=true
autorestart=true
startsecs=30
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/vllm/logs/vllm.log
stderr_logfile=/workspace/vllm/logs/vllm.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5


; =========================================================
; Control plane — FastAPI on 127.0.0.1:8002, behind Traefik at /admin/*
; =========================================================
[program:control_plane]
directory=/workspace/services/control_plane
command=/workspace/bin/run_control_plane.sh
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/control_plane.log
stderr_logfile=/workspace/logs/control_plane.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3


; =========================================================
; Traefik — public entrypoint on :8000
;   /v1/*    -> vLLM  (127.0.0.1:8001)
;   /admin/* -> control plane (127.0.0.1:8002)
; =========================================================
[program:traefik]
directory=/workspace
command=/workspace/bin/traefik --configFile=/workspace/traefik/traefik.yml
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/traefik.log
stderr_logfile=/workspace/logs/traefik.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
